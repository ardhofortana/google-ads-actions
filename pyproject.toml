[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "google-ads-actions"
version = "0.1.0"
requires-python = ">=3.11"
license = "Apache-2.0"
description = "Guarded propose/execute write tools for one Google Ads account, as an MCP server."
dependencies = [
    "google-ads>=34.0.0,<35",
    "mcp[cli]>=2.0.0,<3",
    "fastmcp>=4.0.6,<5",
    "py-key-value-aio[firestore]>=0.4.5,<0.5.0",
    "google-cloud-firestore>=2.16",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
google-ads-actions = "ads_actions.server:run_server"

[tool.setuptools]
packages = ["ads_actions"]

[tool.setuptools.package-data]
ads_actions = ["guardrails.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
